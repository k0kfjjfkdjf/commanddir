name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: App icons
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          RES=android/app/src/main/res
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            rsvg-convert -w $s -h $s www/icons/icon.svg -o $RES/mipmap-$n/ic_launcher.png
            rsvg-convert -w $s -h $s www/icons/icon.svg -o $RES/mipmap-$n/ic_launcher_round.png
            fg=$((s * 108 / 48))
            rsvg-convert -w $fg -h $fg www/icons/maskable.svg -o $RES/mipmap-$n/ic_launcher_foreground.png
          done

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../CommandDir.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CommandDir-apk
          path: CommandDir.apk

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CommandDir.apk
