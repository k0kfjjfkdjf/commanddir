name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: App icons
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          RES=android/app/src/main/res
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            rsvg-convert -w $s -h $s www/icons/icon.svg -o $RES/mipmap-$n/ic_launcher.png
            rsvg-convert -w $s -h $s www/icons/icon.svg -o $RES/mipmap-$n/ic_launcher_round.png
            fg=$((s * 108 / 48))
            rsvg-convert -w $fg -h $fg www/icons/maskable.svg -o $RES/mipmap-$n/ic_launcher_foreground.png
          done

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../CommandDir.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CommandDir-apk
          path: CommandDir.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: CommandDir ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Android APK шпаргалки CommandDir. Скачайте CommandDir.apk на телефон и установите
            (потребуется разрешить установку из этого источника).
            Веб-версия: https://k0kfjjfkdjf.github.io/commanddir/
          files: CommandDir.apk
