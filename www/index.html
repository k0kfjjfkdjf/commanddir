<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="description" content="CommandDir — офлайн-шпаргалка по командам Linux, macOS и Windows: описания, опции, примеры, конструкции оболочек и разбор конвейеров.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CommandDir">
<title>CommandDir — шпаргалка по командам</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-row">
      <button class="icon-btn" id="backBtn" aria-label="Назад" hidden>
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
      </button>
      <h1 class="brand" id="title"><span class="brand-prompt">&gt;_</span> CommandDir</h1>
      <button class="icon-btn" id="themeBtn" aria-label="Сменить тему">
        <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      </button>
    </div>
    <div class="search-wrap" id="searchWrap">
      <svg viewBox="0 0 24 24" class="search-ico"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="search" type="search" placeholder="Поиск: команда, действие, флаг…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="clear-btn" id="clearSearch" aria-label="Очистить" hidden>×</button>
    </div>
    <div class="os-switch" id="osSwitch" role="tablist">
      <button data-os="all" class="active">Все</button>
      <button data-os="l"><i class="dot l"></i>Linux</button>
      <button data-os="m"><i class="dot m"></i>macOS</button>
      <button data-os="w"><i class="dot w"></i>Windows</button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="commands" class="active">
      <svg viewBox="0 0 24 24"><path d="M4 6l5 5-5 5M12 18h8"/></svg><span>Команды</span>
    </button>
    <button data-tab="concepts">
      <svg viewBox="0 0 24 24"><path d="M8 4H6a2 2 0 0 0-2 2v4l-2 2 2 2v4a2 2 0 0 0 2 2h2M16 4h2a2 2 0 0 1 2 2v4l2 2-2 2v4a2 2 0 0 1-2 2h-2"/></svg><span>Конструкции</span>
    </button>
    <button data-tab="recipes">
      <svg viewBox="0 0 24 24"><path d="M4 7h4l3 10 3-10h6"/><circle cx="4" cy="7" r="1.5"/><circle cx="20" cy="7" r="1.5"/></svg><span>Рецепты</span>
    </button>
    <button data-tab="explain">
      <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg><span>Разбор</span>
    </button>
    <button data-tab="favorites">
      <svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg><span>Избранное</span>
    </button>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="data/commands-unix.js"></script>
<script src="data/commands-linux.js"></script>
<script src="data/commands-macos.js"></script>
<script src="data/commands-windows.js"></script>
<script src="data/concepts.js"></script>
<script src="data/recipes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
